<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Directory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Team Directory</h1>
      <p class="intro">Our team, loaded live from a server.</p>
      <button id="load-btn" type="button">Load team</button>
      <!-- aria-live: screen readers announce changes to this message -->
      <p id="status" aria-live="polite"></p>
    </header>

    <!-- The cards appear here. It starts empty on purpose. -->
    <section id="user-list" class="grid"></section>
  </main>

  <!-- Live demo: app.js. Backup if live coding breaks: change to app.final.js -->
  <script src="app.js"></script>
</body>
</html>
